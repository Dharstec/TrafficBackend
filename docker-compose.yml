version: '3.8'

services:
  db:
    image: timescale/timescaledb-ha:pg14-latest
    container_name: traffic_db
    environment:
      POSTGRES_DB: traffic_db
      POSTGRES_USER: traffic_user
      POSTGRES_PASSWORD: traffic_pass
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U traffic_user -d traffic_db']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: traffic_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://traffic_user:traffic_pass@db:5432/traffic_db
      JWT_SECRET: traffic_jwt_secret_2024
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  pgdata:
