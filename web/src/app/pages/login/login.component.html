<div class="login-page">
  <div class="login-blob login-blob--a"></div>
  <div class="login-blob login-blob--b"></div>
  <div class="login-grid"></div>

  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-mark">
        <i class="bi bi-traffic-cone-fill"></i>
      </div>
      <h4 class="login-title">GCTP Traffic Monitor</h4>
      <p class="login-subtitle">Greater Chennai Traffic Police</p>
    </div>

    <div class="login-error" *ngIf="error">{{ error }}</div>

    <form (ngSubmit)="login()">
      <div class="field-group">
        <label class="field-label">Email</label>
        <input type="email" class="field-input" [(ngModel)]="email" name="email" required placeholder="officer@gctp.gov.in" />
      </div>
      <div class="field-group">
        <label class="field-label">Password</label>
        <input type="password" class="field-input" [(ngModel)]="password" name="password" required placeholder="••••••••" />
      </div>
      <button class="login-submit" type="submit" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm"></span>
        Sign In
      </button>
    </form>

    <div class="login-demo">
      <p class="login-demo-title">Demo Credentials</p>
      <p class="login-demo-row">Admin: admin&#64;gctp.gov.in / Admin&#64;123</p>
      <p class="login-demo-row">Supervisor: supervisor&#64;gctp.gov.in</p>
      <p class="login-demo-row">Officer: ravi&#64;gctp.gov.in / Field&#64;123</p>
    </div>
  </div>
</div>
