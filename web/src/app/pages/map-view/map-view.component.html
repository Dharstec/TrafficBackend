<div class="topbar">
  <h5 class="topbar-title"><i class="bi bi-map"></i>City Map View</h5>
  <div class="tw-flex tw-gap-2 tw-items-center tw-flex-wrap">
    <div class="mode-switch">
      <button [class.active]="mode==='live'" (click)="switchMode('live')">Live</button>
      <button [class.active]="mode==='snapshot'" (click)="switchMode('snapshot')">Snapshot</button>
    </div>
    <ng-container *ngIf="mode==='snapshot'">
      <input type="date" class="field-input field-input--compact" [(ngModel)]="snapshotDate" />
      <input type="time" class="field-input field-input--compact" [(ngModel)]="snapshotTime" />
      <button class="btn-solid-success" (click)="loadSnapshot()">Go</button>
    </ng-container>
  </div>
</div>

<div class="tw-grid tw-grid-cols-1 lg:tw-grid-cols-12 tw-gap-4">
  <div class="lg:tw-col-span-9">
    <div id="city-map" class="map-frame"></div>
  </div>
  <div class="lg:tw-col-span-3">
    <div class="table-card tw-h-full">
      <h6 class="table-card-title">Congestion Legend</h6>
      <div class="legend-row">
        <div class="legend-dot legend-dot--usual"></div>
        <div><div class="cell-strong cell-small">Usual</div><div class="cell-faint">1–2 mins delay</div></div>
      </div>
      <div class="legend-row">
        <div class="legend-dot legend-dot--normal"></div>
        <div><div class="cell-strong cell-small">Normal</div><div class="cell-faint">3–5 mins delay</div></div>
      </div>
      <div class="legend-row">
        <div class="legend-dot legend-dot--intermediate"></div>
        <div><div class="cell-strong cell-small">Intermediate</div><div class="cell-faint">6–9 mins delay</div></div>
      </div>
      <div class="legend-row legend-row--last">
        <div class="legend-dot legend-dot--heavy"></div>
        <div><div class="cell-strong cell-small">Heavy</div><div class="cell-faint">10+ mins delay</div></div>
      </div>
      <hr class="legend-divider" />
      <h6 class="table-card-title">Junctions</h6>
      <div *ngFor="let d of trafficData" class="junction-mini-card">
        <div class="cell-strong cell-small">{{ d.junction_name }}</div>
        <div class="tw-flex tw-items-center tw-gap-2 tw-mt-1">
          <span class="congestion-dot dot-{{ d.congestion_level }}"></span>
          <span class="cell-faint">{{ d.delay_minutes }} min · {{ d.congestion_level }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
