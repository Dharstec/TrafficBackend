<div class="sidebar">
  <div class="logo">
    <span class="logo-mark">
      <i class="bi bi-traffic-cone-fill"></i>
      <span class="logo-pulse"></span>
    </span>
    <span class="logo-text">GCTP Monitor</span>
  </div>
  <nav class="mt-2 flex-grow-1">
    <p class="nav-section-label">Traffic Tools</p>
    <a routerLink="/dashboard" routerLinkActive="active"><i class="bi bi-speedometer2"></i>Dashboard</a>
    <a routerLink="/live-monitor" routerLinkActive="active"><i class="bi bi-broadcast"></i>Live Monitor</a>
    <a routerLink="/map" routerLinkActive="active"><i class="bi bi-map"></i>City Map View</a>

    <p class="nav-section-label">Data Management</p>
    <a routerLink="/junctions" routerLinkActive="active"><i class="bi bi-signpost-2"></i>Junctions</a>
    <a routerLink="/officers" routerLinkActive="active"><i class="bi bi-person-badge"></i>Police Management</a>
  </nav>

  <div class="sidebar-footer">
    <button class="theme-toggle" (click)="theme.toggle()" [title]="theme.isDark ? 'Switch to light' : 'Switch to dark'">
      <i class="bi" [class.bi-sun]="theme.isDark" [class.bi-moon-stars]="!theme.isDark"></i>
      {{ theme.isDark ? 'Light mode' : 'Dark mode' }}
    </button>
    <div class="footer-user">
      <span class="footer-avatar">{{ auth.currentUser?.name?.charAt(0) }}</span>
      <span class="footer-user-info">
        <span class="footer-name">{{ auth.currentUser?.name }}</span>
        <span class="footer-role">{{ auth.currentUser?.role | titlecase }}</span>
      </span>
    </div>
    <a class="footer-logout" (click)="auth.logout()">
      <i class="bi bi-box-arrow-left"></i>Logout
    </a>
  </div>
</div>
